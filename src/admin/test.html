  <!--
    Sandbox copy of /admin/ for trying out the CMS with no GitHub login and
    no decap-server. Uses config-test.yml (backend: test-repo), which keeps
    everything in this browser tab's memory only — nothing is read from or
    written to the repo, and a refresh resets whatever you typed. Safe to
    hand to anyone on any device just to click around the editing UI.
  -->
  <link href="config-test.yml" type="text/yaml" rel="cms-config-url" />
</head>
<body>
  <script
    src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"
    integrity="sha384-d2pbrhjc5asvSK35gKkrgRIk0Wq+2CQynWnXtSsYWQawXCgBXhcAK737jBAKXT4T"
